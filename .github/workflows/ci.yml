name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore src/api/HomeBanking.Api/HomeBanking.Api.csproj
    
    - name: Build API
      run: dotnet build src/api/HomeBanking.Api/HomeBanking.Api.csproj --no-restore
    
    - name: Run API Tests
      run: dotnet test tests/HomeBanking.Api.Tests/HomeBanking.Api.Tests.csproj --no-restore --verbosity normal

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/web/package-lock.json
    
    - name: Install dependencies
      run: npm ci
      working-directory: src/web
    
    - name: Build frontend
      run: npm run build
      working-directory: src/web

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [api-tests, frontend-build]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install frontend dependencies
      run: npm ci
      working-directory: src/web
    
    - name: Install E2E dependencies
      run: npm ci
      working-directory: tests/e2e
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      working-directory: tests/e2e
    
    - name: Run E2E Tests
      run: npm test
      working-directory: tests/e2e
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: tests/e2e/playwright-report/
        retention-days: 30
